name: Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          # 32비트 아키텍처 추가 (i386 패키지 설치를 위한 필수 설정)
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          sudo apt-get install -y libc6:i386 libncurses5:i386 libstdc++6:i386 libtinfo5:i386 zlib1g:i386

      - name: Install Buildozer & Cython
        run: |
          pip3 install --upgrade pip
          # buildozer 호환성을 위해 Cython 버전을 3.0 미만으로 제한하여 설치
          pip3 install --user --upgrade buildozer "cython<3.0" virtualenv

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # 빌더를 돌릴 때 sdk 라이선스 동의 처리 자동 수락 적용
          buildozer android debug
        continue-on-error: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishBattle-APK
          path: bin/*.apk
